{{- if .Values.secrets.createToken }}
{{- /* keep the token across upgrades: generate it only on first install */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.token }}
{{- $token := "" }}
{{- if and $existing $existing.data $existing.data.token }}
{{- $token = $existing.data.token }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
# bearer token shared by ESO (ClusterSecretStore) and the gateway
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.token }}
  labels:
    {{- include "protonpass-server.labels" . | nindent 4 }}
    # ESO only reads Secrets carrying this label
    external-secrets.io/type: webhook
type: Opaque
data:
  token: {{ $token }}
{{- end }}
