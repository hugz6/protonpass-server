{{- if .Values.eso.clusterSecretStore.create }}
{{- $url := printf "https://%s.%s.svc:8443/v1/secrets" (include "protonpass-server.fullname" .) .Release.Namespace }}
# ESO templates use {{ "{{ }}" }} too: they are escaped so Helm writes them as is.
# In an ExternalSecret: remoteRef.key is SHARE_ID/ITEM_ID, remoteRef.property
# the field name. ESO escapes both itself (url.QueryEscape).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.eso.clusterSecretStore.name }}
  labels:
    {{- include "protonpass-server.labels" . | nindent 4 }}
spec:
  provider:
    webhook:
      url: "{{ $url }}/{{ "{{" }} .remoteRef.key {{ "}}" }}?field={{ "{{" }} .remoteRef.property {{ "}}" }}"
      method: GET
      headers:
        Authorization: "Bearer {{ "{{" }} print .auth.token {{ "}}" }}"
      secrets:
        - name: auth
          secretRef:
            name: {{ .Values.secrets.token }}
            namespace: {{ .Release.Namespace }}
      {{- with .Values.eso.clusterSecretStore.jsonPath }}
      result:
        jsonPath: {{ . | quote }}
      {{- end }}
      caProvider:
        type: Secret
        name: {{ .Values.tls.secretName }}
        namespace: {{ .Release.Namespace }}
        key: ca.crt
{{- end }}
