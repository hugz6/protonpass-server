# Only ESO may reach the Pod; the Pod may only resolve names and reach the
# Proton API over HTTPS. It applies to the whole Pod, not to one container.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "protonpass-server.fullname" . }}
  labels:
    {{- include "protonpass-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "protonpass-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.eso.namespace }}
      ports:
        - port: 8443
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Proton API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
