# No secret in this file: it ends up in git, and Helm stores every installed
# version of it in the cluster. Secrets are referenced by name instead.

gateway:
  image:
    # -- Gateway image repository.
    repository: ghcr.io/hugz6/protonpass-gateway
    # -- Gateway image tag.
    # @default -- `.Chart.AppVersion`
    tag: ""
    # -- Gateway image pull policy.
    pullPolicy: IfNotPresent
  # -- UID of the gateway container. The broker only accepts connections from this UID.
  uid: 10002
  # -- Timeout of one broker call. Must outlast `broker.timeout`, or the gateway gives up before the answer.
  timeout: 35s

broker:
  image:
    # -- Broker image repository (contains pass-cli).
    repository: ghcr.io/hugz6/protonpass-broker
    # -- Broker image tag.
    # @default -- `.Chart.AppVersion`
    tag: ""
    # -- Broker image pull policy.
    pullPolicy: IfNotPresent
  # -- UID of the broker container.
  uid: 10001
  # -- Timeout of one pass-cli call.
  timeout: 30s
  # -- Maximum pass-cli calls running at the same time. Extra requests wait, then get a 503.
  maxConcurrent: 4

# -- Group shared by both containers. It owns the socket volume, so the gateway can reach the broker.
fsGroup: 10000

# Secrets used by the pods. Only the personal access token has to be created
# by hand.
secrets:
  # -- Name of an existing Secret, created by hand, holding the Proton Pass personal access token (`pst_<token>::<key>`) under the key `pat`. Mounted in the broker only.
  pat: protonpass-pat
  # -- Name of the Secret holding the bearer token ESO sends to the gateway, under the key `token`. Mounted in the gateway only.
  token: protonpass-gateway-token
  # -- Generate the token Secret (random, kept across upgrades, labelled for ESO). Set to false to provide your own: it must then carry the label `external-secrets.io/type=webhook`.
  createToken: true

tls:
  # -- Name of the TLS Secret of the gateway (`tls.crt`, `tls.key`, `ca.crt`). ESO trusts `ca.crt`, and only reads it if it carries the label `external-secrets.io/type=webhook` (set automatically with cert-manager).
  secretName: protonpass-gateway-tls
  certManager:
    # -- Create the TLS Secret with cert-manager. Set to false to provide the Secret yourself.
    enabled: true
    # -- Create a private CA for the release (self-signed Issuer, CA Certificate, CA Issuer) and sign the gateway certificate with it. Set to false to use `issuerRef` instead.
    createCA: true
    issuerRef:
      # -- Issuer signing the gateway certificate. Required when `tls.certManager.createCA` is false.
      name: ""
      # -- `Issuer` or `ClusterIssuer`.
      kind: Issuer

eso:
  # -- Namespace of External Secrets Operator: the only one allowed to reach the gateway (NetworkPolicy).
  namespace: external-secrets
  clusterSecretStore:
    # -- Create a `ClusterSecretStore` pointing at the gateway.
    create: true
    # -- Name of the `ClusterSecretStore`.
    name: protonpass
    # -- Where ESO reads the value. The broker answers `{"value": "..."}` when a field (`remoteRef.property`) is set.
    jsonPath: $.value

resources:
  # -- Resources of the gateway container.
  gateway:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  # -- Resources of the broker container (pass-cli runs here).
  broker:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
