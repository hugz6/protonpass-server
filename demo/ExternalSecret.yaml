apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: protonpass
  target:
    name: database
  data:
    - secretKey: password
      remoteRef:
        key: k8s/secret
        property: password
